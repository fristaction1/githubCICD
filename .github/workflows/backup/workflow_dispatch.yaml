name: workflow_dispatch
on: 
  workflow_dispatch:
    inputs:
      name:
        description: 'set name'
        required: true
        default: 'github-actions'
        type: string
      enviroment:
        description: 'set env'
        required: true
        default: 'dev'
        options:
          - dev
          - prod
jobs:
  workflow_dispatch-job:
    runs-on: ubuntu-latest
    steps:
      - name: step1 echo hello world
        run: echo helllo world!

      - name: step2 echo hello world
        run: |
          echo helllo world!
          echo helllo world!

      - name: echo inputs
        run: |
          echo "NAME ${{inputs.name}}"
          echo "ENVIROMENT ${{inputs.enviroment}}"